# Grapifly ID — production (grapifly.com + id.grapifly.com)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reverse proxy: Traefik on the external `grapifly_proxy` network
# (entrypoint `websecure`, cert resolver `le`) — same pattern as jtrade.
# MongoDB is external (Atlas) — set MONGODB_URI in env/.env.prod.
# Secrets: grapifly/env/.env.prod  (gitignored, provided on the server).

services:

  grapifly-backend:
    build:
      context: ./backend
    container_name: grapifly_backend
    restart: unless-stopped
    env_file:
      - ./env/.env.prod
    environment:
      NODE_ENV: production
      PORT: 3101
      # Browser-facing (CORS + SSO/redirect targets).
      FRONTEND_URL: https://grapifly.com
      GRAPIFLY_APP_URL: https://grapifly.com
      RELAY_APP_URL: https://relay.grapifly.com
      BUSINESS_APP_URL: https://businessapp.grapifly.com
      JTRADE_APP_URL: https://jtrade.grapifly.com
      RELAY_SSO_CALLBACK_URL: https://relay.grapifly.com/auth/grapifly/callback
      JTRADE_SSO_CALLBACK_URL: https://jtrade.grapifly.com/auth/grapifly/callback
      GOOGLE_CALLBACK_URL: https://id.grapifly.com/auth/google/callback
      # Server-to-server (through Traefik).
      RELAY_API_URL: https://api.relay.grapifly.com
    networks:
      - default
      - grapifly_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=grapifly_proxy"
      - "traefik.http.routers.grapifly-id.rule=Host(`id.grapifly.com`)"
      - "traefik.http.routers.grapifly-id.entrypoints=websecure"
      - "traefik.http.routers.grapifly-id.tls=true"
      - "traefik.http.routers.grapifly-id.tls.certresolver=le"
      - "traefik.http.services.grapifly-id.loadbalancer.server.port=3101"

  grapifly-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_ID_API_URL: https://id.grapifly.com
        NEXT_PUBLIC_JTRADE_URL: https://jtrade.grapifly.com
        NEXT_PUBLIC_BUSINESS_URL: https://businessapp.grapifly.com
        NEXT_PUBLIC_COMMUNICATIONS_URL: https://relay.grapifly.com
    container_name: grapifly_frontend
    restart: unless-stopped
    depends_on:
      - grapifly-backend
    networks:
      - default
      - grapifly_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=grapifly_proxy"
      - "traefik.http.routers.grapifly-web.rule=Host(`grapifly.com`) || Host(`www.grapifly.com`)"
      - "traefik.http.routers.grapifly-web.entrypoints=websecure"
      - "traefik.http.routers.grapifly-web.tls=true"
      - "traefik.http.routers.grapifly-web.tls.certresolver=le"
      - "traefik.http.services.grapifly-web.loadbalancer.server.port=3100"

networks:
  grapifly_proxy:
    external: true
