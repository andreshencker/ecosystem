services:
  mongo:
    image: mongo:7
    container_name: grapifly_mongodb
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - grapifly_mongo_data:/data/db

  backend:
    build: ./backend
    container_name: grapifly_backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      PORT: 3101
      MONGODB_URI: mongodb://mongo:27017/grapifly_identity
    ports:
      - "3101:3101"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_ID_API_URL: http://localhost:3101
        NEXT_PUBLIC_JTRADE_URL: http://localhost:5173
        NEXT_PUBLIC_BUSINESS_URL: http://localhost:3003
        NEXT_PUBLIC_COMMUNICATIONS_URL: http://localhost:3000
    container_name: grapifly_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3100:3100"

volumes:
  grapifly_mongo_data:
