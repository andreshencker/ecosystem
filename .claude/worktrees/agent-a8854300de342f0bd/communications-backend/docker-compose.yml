version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: cp_redis
    ports:
      - '6379:6379'
    command: redis-server --save '' --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # MongoDB is managed externally via MongoDB Atlas.
  # If you want a local MongoDB for development, uncomment below:
  #
  # mongodb:
  #   image: mongo:7
  #   container_name: cp_mongodb
  #   ports:
  #     - '27017:27017'
  #   environment:
  #     MONGO_INITDB_DATABASE: communication_platform_db
