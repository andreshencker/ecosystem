# jtrade — LOCAL. `docker compose -f docker-compose.local.yml up -d --build`
#
# Frontend (nginx) serves the SPA on :5173 and proxies /backend to the backend
# container. Mongo is the standalone `jtrade_mongodb` container on the host
# (mongodb://host.docker.internal:27017) — same "external Mongo" shape as prod.

services:
  backend:
    build:
      context: ./backend
      args:
        NODE_ENV: local
    container_name: backend
    env_file: ./env/.env.local
    environment:
      NODE_ENV: local
      PORT: 3002
      CONTEXT_PATH: /backend
      MONGODB_URI: mongodb://host.docker.internal:27017/jtrade
      GRAPIFLY_ID_API_URL: http://host.docker.internal:3101
      GRAPIFLY_FRONTEND_URL: http://localhost:3100
      RELAY_API_URL: http://host.docker.internal:3001
      FRONTEND_BASE_URL: http://localhost:5173
      JTRADE_PUBLIC_API_URL: http://localhost:5173/backend
      ALLOWED_ORIGINS: http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NODE_ENV: local
        VITE_API_BASE: http://localhost:5173/backend
        VITE_GRAPIFLY_ID_URL: http://localhost:3101
        VITE_GRAPIFLY_WEB_URL: http://localhost:3100
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
