version: "3.9"

services:
  orchestrator:
    build:
      context: ./orchestrator
      args:
        NODE_ENV: local
    container_name: orchestrator
    env_file: ./orchestrator/.env.local
    ports:
      - "3003:3003"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        NODE_ENV: local
    container_name: backend
    env_file: ./backend/.env.local
    ports:
      - "3002:3002"
    restart: unless-stopped

#  communication:
#    build:
#      context: ./communication
#      args:
#        NODE_ENV: local
#    container_name: communication
#    env_file: ./communication/.env.local
#    ports:
#      - "3001:3001"
#    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NODE_ENV: local
    container_name: frontend
    ports:
      - "5173:80"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
      - orchestrator
      - communication
    restart: unless-stopped