server {
    listen 80;
    server_name _;

    # FRONTEND (SPA)
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # BACKEND — same-origin API for the SPA (VITE_API_BASE = https://jtrade.grapifly.com/backend)
    # Target is the jtrade backend by its unique compose service name. Using the
    # Docker embedded resolver (127.0.0.11) + a variable forces nginx to re-resolve
    # on every request window, so a backend container restart never leaves nginx
    # pinned to a stale IP (which would surface as a 502).
    location /backend {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jtrade_backend http://jtrade-backend:3002;
        proxy_pass $jtrade_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
