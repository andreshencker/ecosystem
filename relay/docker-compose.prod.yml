# Relay — production (relay.grapifly.com + api.relay.grapifly.com)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reverse proxy: Traefik on the external `grapifly_proxy` network.
# Secrets: relay/backend/.env.prod  (gitignored, provided on the server).

name: relay

services:

  redis:
    image: redis:7-alpine
    container_name: relay_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - relay_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [relay_internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: relay-backend:prod
    container_name: relay_backend
    restart: unless-stopped
    env_file:
      - ./env/.env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Browser-facing.
      APP_BASE_URL: https://relay.grapifly.com
      API_BASE_URL: https://api.relay.grapifly.com
      ALLOWED_ORIGINS: https://relay.grapifly.com
      XERO_OAUTH_FRONTEND_RETURN_URL: https://relay.grapifly.com/provider-credentials
      GOOGLE_EMAIL_OAUTH_FRONTEND_RETURN_URL: https://relay.grapifly.com/provider-credentials
      # Server-to-server (through Traefik).
      GRAPIFLY_ID_API_URL: https://id.grapifly.com
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - relay_internal
      - grapifly_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.relay-api.rule=Host(`api.relay.grapifly.com`)"
      - "traefik.http.routers.relay-api.entrypoints=websecure"
      - "traefik.http.routers.relay-api.tls=true"
      - "traefik.http.routers.relay-api.tls.certresolver=le"
      - "traefik.http.services.relay-api.loadbalancer.server.port=3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.relay.grapifly.com
        NEXT_PUBLIC_GRAPIFLY_ID_URL: https://id.grapifly.com
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_COMM_API_KEY: ${NEXT_PUBLIC_COMM_API_KEY:-}
    image: relay-frontend:prod
    container_name: relay_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_started
    networks:
      - relay_internal
      - grapifly_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.relay-web.rule=Host(`relay.grapifly.com`)"
      - "traefik.http.routers.relay-web.entrypoints=websecure"
      - "traefik.http.routers.relay-web.tls=true"
      - "traefik.http.routers.relay-web.tls.certresolver=le"
      - "traefik.http.services.relay-web.loadbalancer.server.port=3000"

networks:
  relay_internal:
    name: relay_internal
  grapifly_proxy:
    external: true

volumes:
  relay_redis_data:
    name: relay_redis_data
